# configs/hosts-completo.yml
#
# Overrides OPCIONAIS por host consumidos pela role infra-vms (provisionador
# libvirt). Todos têm default global em inventario/group_vars/all.yml e só
# precisam aparecer aqui quando o host foge do padrão:
#
#   disk_size              tamanho do overlay qcow2 do host (default: 20G).
#                          Só vale a pena setar onde 20G é insuficiente.
#
#   sobe_com_cluster       false tira o host do `make up` (só `make ops-up` o cria).
#                          Padrão: true. Nenhuma VM liga no boot do PC.
#
#   distro_base            almalinux ou debian, para trocar a distribuição de um
#                          host (padrão: o valor global de all.yml).
#
#   Limites de cgroup no XML do domínio (vazios por padrão -> blocos
#   cputune/memtune/blkiotune são omitidos quando não definidos):
#     cgroup_cpu_shares    peso relativo de CPU (padrão libvirt 1024)
#     cgroup_cpu_quota     cota de CPU em us por período (cputune/quota)
#     cgroup_cpu_period    período de CPU em us (cputune/period)
#     cgroup_mem_hard_limit  teto rígido de memória, em MiB (memtune/hard_limit)
#     cgroup_mem_soft_limit  teto flexível de memória, em MiB (memtune/soft_limit)
#     cgroup_blkio_weight    peso de E/S de bloco, 100-1000 (padrão 500)
#
# A topologia `completo` é a mais pesada (roda num notebook e passa pela
# validação Sonobuoy). Por isso os nós de SUPORTE (loadbalancers + nfs), que
# têm só 512 MiB / 1 cpu, recebem peso reduzido de CPU e de E/S de bloco para
# dar prioridade aos managers/workers sob contenção. Os limites são relativos:
# em folga de recursos ninguém é artificialmente limitado; sob disputa, o
# escalonador favorece o cluster. Managers/workers ficam com os defaults.
---
all:
  vars:
    ansible_user: k8sbox

  children:
    loadbalancers:
      hosts:
        loadbalancer1:
          ansible_host: 172.24.0.21
          fqdn: loadbalancer1.k8sbox.local
          memory: 512
          cpus: 1
          # Nó de suporte: metade do peso de CPU (padrão 1024) e peso de E/S
          # de bloco reduzido para ceder prioridade ao cluster sob contenção.
          cgroup_cpu_shares: 512
          cgroup_blkio_weight: 300
        loadbalancer2:
          ansible_host: 172.24.0.22
          fqdn: loadbalancer2.k8sbox.local
          memory: 512
          cpus: 1
          # Mesmo tratamento do loadbalancer1 (par do keepalived).
          cgroup_cpu_shares: 512
          cgroup_blkio_weight: 300

    nfs:
      hosts:
        nfs1:
          ansible_host: 172.24.0.25
          fqdn: nfs.k8sbox.local
          memory: 512
          cpus: 1
          # Nó de suporte: pouco CPU, mas peso de E/S de bloco um pouco maior
          # que os loadbalancers por ser o nó de armazenamento (serve os
          # volumes do cluster e não deve ser estrangulado em I/O).
          cgroup_cpu_shares: 512
          cgroup_blkio_weight: 500
          # Armazena os volumes persistentes exportados via NFS; 20G do default
          # é apertado para dados de PVCs, então damos uma folga ao overlay.
          disk_size: "40G"

    managers:
      hosts:
        manager1:
          ansible_host: 172.24.0.31
          fqdn: manager1.k8sbox.local
          memory: 3072
          cpus: 2
        manager2:
          ansible_host: 172.24.0.32
          fqdn: manager2.k8sbox.local
          memory: 3072
          cpus: 2
        manager3:
          ansible_host: 172.24.0.33
          fqdn: manager3.k8sbox.local
          memory: 3072
          cpus: 2

    workers:
      hosts:
        worker1:
          ansible_host: 172.24.0.41
          fqdn: worker1.k8sbox.local
          memory: 4096
          cpus: 4
        worker2:
          ansible_host: 172.24.0.42
          fqdn: worker2.k8sbox.local
          memory: 4096
          cpus: 4

    cluster:
      children:
        managers: {}
        workers: {}

    suporte:
      children:
        loadbalancers: {}
        nfs: {}

    todos:
      children:
        suporte: {}
        cluster: {}

    clientes:
      hosts:
        kubox:
          ansible_host: 172.24.0.254
          fqdn: kubox.k8sbox.local
          memory: 1024
          cpus: 1
          sobe_com_cluster: false
