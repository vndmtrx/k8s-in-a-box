# ansible/k8s-cluster-base/tasks/01-instalacao.yml
---
# Os pacotes do SO (inclusive o cliente NFS) vêm do cloud-init: ver ansible/infra-vms/vars/main.yml.
- name: Conferir se os comandos do SO existem
  ansible.builtin.shell: "command -v {{ item }}"  # noqa command-instead-of-shell
  loop: "{{ comandos_so_kubernetes }}"
  register: comandos_conferidos
  changed_when: false
  failed_when: false

- name: Falhar se faltar algum comando do SO
  ansible.builtin.assert:
    that: comandos_conferidos.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      Faltam comandos em {{ inventory_hostname }}:
      {{ comandos_conferidos.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | join(', ') }}.
      Os pacotes do SO vêm do cloud-init: revise ansible/infra-vms/vars/main.yml
      e recrie a VM (make clean-vms).
    quiet: true

- name: Garantir configuração de módulos necessários
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: "{{ modulos_kernel_kubernetes | join('\n') }}\n"
    mode: "0644"
  notify: Recarregar módulos do kernel

- name: Carregar módulos explicitamente
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ modulos_kernel_kubernetes }}"

- name: Verificar se swap está ativo
  ansible.builtin.command: swapon --show
  register: swap_status
  changed_when: false

- name: Desabilitar swap
  ansible.builtin.command: swapoff -a
  when: swap_status.stdout != ""
  changed_when: true

- name: Remover entrada de swap do /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s.*)'
    replace: '# \1'

- name: Configurar parâmetros de rede para Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf  # o Debian 13 não lê /etc/sysctl.conf no boot
    state: present
    reload: true
  loop:
    - { key: "net.ipv4.ip_forward", value: "1" }
    - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }

- name: Criar usuário kubernetes
  ansible.builtin.user:
    name: kubernetes
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/kubernetes
    create_home: false

- name: Criar diretório de configuração
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: kubernetes
    mode: "0750"
  loop:
    - /etc/kubernetes
    - /etc/kubernetes/pki

- name: Criar diretório de trabalho do Kubernetes
  ansible.builtin.file:
    path: /var/lib/kubernetes
    state: directory
    owner: kubernetes
    group: kubernetes
    mode: "0700"
