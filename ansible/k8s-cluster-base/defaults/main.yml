# ansible/k8s-cluster-base/defaults/main.yml
---
# Comandos que o cloud-init deve ter instalado nos nós do cluster
# (pacotes em ansible/infra-vms/vars/main.yml, grupo cluster).
comandos_so_kubernetes:
  - ip
  - nft
  - iptables
  - conntrack
  - ethtool
  - socat
  - tar
  - skopeo
  - chronyc
  - mount.nfs

modulos_kernel_kubernetes:
  - overlay
  - br_netfilter
  - vxlan
  - ip_tables
  - ip6_tables
  - nf_tables
  - nf_nat
  - nf_conntrack
  - xt_conntrack
