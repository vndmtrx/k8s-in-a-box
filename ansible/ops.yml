# ansible/ops.yml
---
- name: Configurações base para as máquinas clientes
  hosts:
    - clientes
  become: true
  gather_facts: false
  roles:
    - role: infra-sistema
      tags:
        - ops-sistema
        - ops

- name: Instalação das ferramentas de operação do cluster
  hosts:
    - clientes
  become: false
  gather_facts: false
  roles:
    - role: ops-ferramentas
      tags:
        - ops-ferramentas
        - ops

- name: Instalação da Rede CNI (Cilium)
  hosts:
    - clientes
  become: false
  gather_facts: false
  roles:
    - role: cni-cilium
      tags:
        - ops-cni-cilium
        - ops-cni
        - ops
        - ops
  tags:
    - ops-cni
    - ops

- name: Implantação dos exemplos de deploys no cluster
  hosts:
    - clientes
  become: false
  gather_facts: false
  roles:
    - role: ops-exemplos
      tags:
        - exemplos
        - ops-exemplos
  tags:
    - exemplos
    - ops-exemplos
