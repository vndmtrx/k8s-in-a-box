# ansible/02-sistema/tasks/00-base.yml
---
# Pacotes, SELinux, fuso horário e idioma do SO vêm do cloud-init (ansible/infra-vms).
- name: Conferir se os comandos do SO existem
  ansible.builtin.shell: "command -v {{ item }}"  # noqa command-instead-of-shell
  loop: "{{ comandos_so_base }}"
  register: comandos_conferidos
  changed_when: false
  failed_when: false

- name: Falhar se faltar algum comando do SO
  ansible.builtin.assert:
    that: comandos_conferidos.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      Faltam comandos em {{ inventory_hostname }}:
      {{ comandos_conferidos.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | join(', ') }}.
      Os pacotes do SO vêm do cloud-init: revise ansible/infra-vms/vars/main.yml
      e recrie a VM (make clean-vms).
    quiet: true

- name: Gerar arquivo /etc/hosts para cada nó do cluster
  ansible.builtin.template:
    src: "hosts.j2"
    dest: "/etc/hosts"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Verificar se Tailspin já está instalado na VM
  ansible.builtin.stat:
    path: "/usr/local/bin/tspin"
  register: tailspin_bin

- name: Instalar Tailspin se não existir
  when: not tailspin_bin.stat.exists
  block:
    - name: Copiar Tailspin para a VM (em /tmp)
      ansible.builtin.copy:
        src: "{{ pasta_cache_binarios }}/{{ download_artefatos['tailspin-bin'].arquivo }}"
        dest: "/tmp/tailspin.tar.gz"
        mode: "0644"

    - name: Descompactar Tailspin em /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/tailspin.tar.gz"
        dest: "/usr/local/bin"
        remote_src: true
        owner: "root"
        group: "root"
        mode: "0755"
        creates: "/usr/local/bin/tspin"

  always:
    - name: Remover arquivo temporário do Tailspin
      ansible.builtin.file:
        path: "/tmp/tailspin.tar.gz"
        state: absent
