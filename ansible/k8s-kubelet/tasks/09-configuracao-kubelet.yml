# ansible/06-kubelet/tasks/09-configuracao-kubelet.yml
---
# Com o systemd-resolved (Debian), o /etc/resolv.conf aponta para o stub 127.0.0.53. O
# CoreDNS herda esse arquivo do kubelet, encaminha para si mesmo e cai com `plugin/loop`.
# Igual ao kubeadm: se o systemd-resolved publica o arquivo com os servidores reais, o
# kubelet usa esse. Sem o systemd-resolved (AlmaLinux), fica o /etc/resolv.conf.
- name: Ver se o systemd-resolved publica o resolv.conf com os servidores reais
  ansible.builtin.stat:
    path: /run/systemd/resolve/resolv.conf
  register: kubelet_resolv_resolved

- name: Configurar parâmetros de inicialização do kubelet
  ansible.builtin.template:
    src: kubelet.env.j2
    dest: "{{ pasta_opt_kubelet }}/kubelet.env"
    mode: "0644"
  notify: Recarregar systemd e reiniciar kubelet

- name: Criar arquivo de configuração principal do kubelet
  ansible.builtin.template:
    src: kubelet-config.yml.j2
    dest: "{{ pasta_opt_kubelet }}/kubelet-config.yml"
    mode: "0644"
  notify: Recarregar systemd e reiniciar kubelet

- name: Criar kubeconfig com configs de usuário para o kubelet
  ansible.builtin.template:
    src: kubelet.kubeconfig.j2
    dest: "{{ pasta_opt_kubelet }}/kubelet.kubeconfig"
    mode: "0644"
  notify: Recarregar systemd e reiniciar kubelet

- name: Configurar serviço do kubelet
  ansible.builtin.template:
    src: kubelet.service.j2
    dest: /etc/systemd/system/kubelet.service
    mode: "0644"
  notify: Recarregar systemd e reiniciar kubelet

- name: Garantir serviço ativo
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
