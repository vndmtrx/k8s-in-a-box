# ansible/06-kubelet/tasks/03-instalacao-kubelet.yml
---
- name: Verificar se o executável do kubelet já está instalado na VM
  ansible.builtin.stat:
    path: "{{ pasta_opt_bin }}/kubelet"
  register: kubelet_bin

- name: Copiar kubelet para a VM
  ansible.builtin.copy:
    src: "{{ pasta_cache_binarios }}/{{ download_artefatos['kubelet-bin'].arquivo }}"
    dest: "{{ pasta_opt_bin }}/kubelet"
    mode: "0755"
    setype: "{{ 'bin_t' if selinux_politica_customizada | bool else omit }}"
  when: not kubelet_bin.stat.exists

- name: Criar diretórios necessários para o kubelet
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('kubernetes') }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    # Configuração
    - { path: "{{ pasta_opt_manifestos }}", owner: root, group: root, mode: "0755" }
    - { path: /var/lib/kubelet }

    # Plugins CSI e storage
    - { path: /var/lib/kubelet/plugins }
    - { path: /var/lib/kubelet/plugins_registry }

    # Estado dos pods
    - { path: /var/lib/kubelet/pods }

    # Logs dos containers
    - { path: /var/log/pods, mode: "0755" }
    - { path: /var/log/containers, mode: "0755" }
