# ansible/ops-ferramentas/tasks/04-etcdctl.yml
---
# O `kubectl cp` usa `tar` dentro do container para empacotar o arquivo antes
# de transferi-lo, e a imagem distroless do etcd não possui `tar`. O `etcdctl`
# sai da própria imagem do etcd que o `k8s-kubelet` já deixou no cache OCI
# (formato docker-archive). Assim ele tem exatamente a versão do container, e o
# passo não depende do container runtime nem de um manager no ar.
- name: Verificar se o executável do etcdctl já está instalado na VM
  ansible.builtin.stat:
    path: "/usr/local/bin/etcdctl"
  register: etcdctl_bin

- name: Instalar o etcdctl a partir da imagem do etcd
  when: not etcdctl_bin.stat.exists
  block:
    - name: Extrair etcdctl da imagem do etcd no cache
      ansible.builtin.script:
        cmd: >-
          extrai-do-oci.py
          {{ pasta_cache_oci }}/etcd-{{ versao_etcd }}.tar
          usr/local/bin/etcdctl
          {{ pasta_cache_binarios }}/etcdctl-{{ versao_etcd }}
        executable: python3
        creates: "{{ pasta_cache_binarios }}/etcdctl-{{ versao_etcd }}"
      delegate_to: localhost
      become: false

    - name: Instalar etcdctl no kubox
      ansible.builtin.copy:
        src: "{{ pasta_cache_binarios }}/etcdctl-{{ versao_etcd }}"
        dest: "/usr/local/bin/etcdctl"
        mode: "0755"
      become: true
