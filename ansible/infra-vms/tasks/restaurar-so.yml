# ansible/infra-vms/tasks/restaurar-so.yml
---
# Volta a VM ao snapshot `so` (clean-k8s). Pula hosts que nunca foram criados e remove
# os que existem sem o snapshot (o próximo `make up` os recria).
- name: Listar os snapshots da VM
  ansible.builtin.command:
    argv: [virsh, -c, "{{ libvirt_uri }}", snapshot-list, --name, "{{ infra_vms_dominio }}"]
  register: infra_vms_snapshots
  changed_when: false
  failed_when: false

- name: Restaurar o snapshot {{ infra_vms_snapshot_so }}
  when:
    - infra_vms_snapshots.rc == 0
    - infra_vms_snapshot_so in infra_vms_snapshots.stdout_lines
  block:
    - name: Desligar a VM
      ansible.builtin.include_tasks: parar-dominio.yml
      vars:
        infra_vms_parar_forcado: true

    - name: Voltar ao snapshot
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - "{{ libvirt_uri }}"
          - snapshot-revert
          - "{{ infra_vms_dominio }}"
          - "{{ infra_vms_snapshot_so }}"
      changed_when: true

    - name: Ligar a VM
      community.libvirt.virt:
        name: "{{ infra_vms_dominio }}"
        state: running
        uri: "{{ libvirt_uri }}"

    - name: Esperar a porta SSH
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: "{{ infra_vms_ssh_timeout }}"

    - name: Marcar a VM como restaurada
      ansible.builtin.set_fact:
        infra_vms_restaurado: true

- name: Avisar quando a VM nunca foi criada
  ansible.builtin.debug:
    msg: "{{ infra_vms_dominio }}: a VM não existe; nada a restaurar."
  when: infra_vms_snapshots.rc != 0

# A VM existe, mas o primeiro boot não chegou ao snapshot (ex.: cloud-init travado ou com
# erro). Ela não tem um "SO pronto" para onde voltar, então sai, e o próximo `make up` a recria.
- name: Remover a VM que não tem o snapshot {{ infra_vms_snapshot_so }}
  when:
    - infra_vms_snapshots.rc == 0
    - infra_vms_snapshot_so not in infra_vms_snapshots.stdout_lines
  block:
    - name: Avisar que a VM será recriada
      ansible.builtin.debug:
        msg: >-
          {{ infra_vms_dominio }}: sem snapshot '{{ infra_vms_snapshot_so }}' (o primeiro boot não
          terminou). A VM será removida; o próximo 'make up' a recria do zero.

    - name: Remover o domínio
      ansible.builtin.include_tasks: remover-dominio.yml
      vars:
        infra_vms_remover_dominio: "{{ infra_vms_dominio }}"

    - name: Apagar a pasta da VM no Target
      ansible.builtin.file:
        path: "{{ infra_vms_dir }}"
        state: absent
