# ansible/infra-vms/vars/main.yml
---
# Tabela_Distros: o ÚNICO lugar do projeto com diferenças entre distribuições.
# Para acrescentar uma distro, acrescente uma entrada aqui e em `imagens_base`
# (inventario/group_vars/all.yml). As roles fora de infra-vms não ramificam por distro.
#
#   boot             bios ou efi (firmware do domínio). efi usa o OVMF com Secure Boot
#                    (libvirt escolhe a variante assinada) e cria um NVRAM por domínio
#   chrony_conf      caminho do chrony.conf
#   chrony_servico   nome do serviço do chrony
#   reboot_pendente  comando que devolve rc 1 quando a VM precisa reiniciar
#   pacotes          pacotes do SO por grupo: `base` vale para toda VM; os demais
#                    valem para hosts do grupo do inventário de mesmo nome
#   runcmd           comandos do primeiro boot próprios da distro
#   bootcmd          comandos que precisam rodar antes dos módulos do cloud-init (todo boot)
#   atualizacao      pacotes, write_files e runcmd da atualização automática
#                    (quando atualiza_sistema não é 'nenhum')
#   sem_atualizacao  write_files e runcmd para DESLIGAR a atualização automática
#                    (atualiza_sistema: nenhum), quando a imagem já a traz ligada
distros:
  almalinux:
    boot: efi
    chrony_conf: /etc/chrony.conf
    chrony_servico: chronyd
    reboot_pendente: needs-restarting -r
    pacotes:
      base:
        - qemu-guest-agent
        - chrony
        - dnf-utils          # needs-restarting, usado na checagem de reboot
        - nano
        - wget
        - bash-completion
        - mtr
        - langpacks-core-pt_BR
        - langpacks-pt
        - glibc-langpack-pt
      cluster:
        - kernel-modules-extra
        - iproute
        - nftables
        - iptables
        - iptables-nft
        - conntrack-tools
        - ethtool
        - socat
        - tar
        - xz
        - skopeo
        - nfs-utils
      loadbalancers:
        - haproxy
        - keepalived
        - openssl
        - socat
      nfs:
        - nfs-utils
      clientes: []
    # Comandos do primeiro boot específicos da distro (rodam em runcmd).
    # SELinux em permissive: a política customizada fica para depois (selinux_politica_customizada).
    runcmd:
      - setenforce 0
      - sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config
    # Atualização automática (só entra quando atualiza_sistema não é 'nenhum').
    atualizacao:
      pacotes:
        - dnf-automatic
      write_files:
        - path: /etc/dnf/automatic.conf
          permissions: "0644"
          content: |
            [commands]
            upgrade_type = {{ 'default' if atualiza_sistema == 'todos' else 'security' }}
            apply_updates = yes
            reboot = never
            {% if pacotes_sem_atualizacao_automatica | length > 0 %}

            [base]
            excludepkgs = {{ pacotes_sem_atualizacao_automatica | join(',') }}
            {% endif %}
      runcmd:
        - systemctl enable --now dnf-automatic.timer

  debian:
    boot: efi
    chrony_conf: /etc/chrony/chrony.conf
    chrony_servico: chrony
    # rc 1 quando o arquivo existe (algum pacote pediu reinício).
    reboot_pendente: test ! -e /var/run/reboot-required
    # O chrony substitui o systemd-timesyncd da imagem (o apt remove o timesyncd).
    # A imagem generic traz o kernel completo, então não há pacote de módulos extras.
    pacotes:
      base:
        - qemu-guest-agent
        - chrony
        - nano
        - wget
        - bash-completion
        - mtr-tiny
        - locales
      cluster:
        - iproute2
        - nftables
        - iptables
        - conntrack
        - ethtool
        - socat
        - tar
        - xz-utils
        - skopeo
        - nfs-common
      loadbalancers:
        - haproxy
        - keepalived
        - openssl
        - socat
      nfs:
        - nfs-kernel-server
      clientes: []
    # O AppArmor já vem ativo na imagem. O cc_locale do cloud-init falha no Debian se o
    # idioma não foi gerado antes (update-locale sai com 255), então o bootcmd, que roda
    # antes dele, acrescenta o idioma ao /etc/locale.gen e roda o locale-gen.
    bootcmd:
      - >-
        grep -qx '{{ locale_lang }} {{ locale_lang.split('.') | last }}' /etc/locale.gen ||
        { echo '{{ locale_lang }} {{ locale_lang.split('.') | last }}' >> /etc/locale.gen && locale-gen; }
    # A unit do qemu-guest-agent é estática e só sobe pelo udev; instalada depois do boot,
    # ela fica parada até o próximo boot.
    runcmd:
      - systemctl start qemu-guest-agent
    # O 52k8sbox-atualizacoes vem depois do 20auto-upgrades e do 50unattended-upgrades
    # da imagem, então vale sobre eles. O `#clear` zera a lista de origens padrão.
    atualizacao:
      pacotes:
        - unattended-upgrades
      write_files:
        - path: /etc/apt/apt.conf.d/52k8sbox-atualizacoes
          permissions: "0644"
          content: |
            {% if atualiza_sistema == 'seguranca' %}
            #clear Unattended-Upgrade::Origins-Pattern;
            Unattended-Upgrade::Origins-Pattern {
                "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
            };
            {% endif %}
            {% if pacotes_sem_atualizacao_automatica | length > 0 %}
            Unattended-Upgrade::Package-Blacklist {
            {% for p in pacotes_sem_atualizacao_automatica %}
                "^{{ p | regex_escape }}$";
            {% endfor %}
            };
            {% endif %}
            Unattended-Upgrade::Automatic-Reboot "false";
            APT::Periodic::Update-Package-Lists "1";
            APT::Periodic::Unattended-Upgrade "1";
      runcmd: []
    # A imagem traz o unattended-upgrades ligado; atualiza_sistema: nenhum o desliga.
    sem_atualizacao:
      write_files:
        - path: /etc/apt/apt.conf.d/52k8sbox-atualizacoes
          permissions: "0644"
          content: |
            APT::Periodic::Unattended-Upgrade "0";
