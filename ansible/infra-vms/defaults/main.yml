# ansible/infra-vms/defaults/main.yml
---
# Defaults internos da role infra-vms.
#
# As variáveis do usuário (pasta_*, distro_base, imagens_base, interface_rede,
# rede_mgmt_*, libvirt_*, disk_size_default, cpu_nested) vivem em
# inventario/group_vars/all.yml. Este arquivo guarda só o que é interno à role.
#
# O playbook provisiona.yml trata cada host do inventário como alvo de um play
# local, então os nomes abaixo usam `inventory_hostname` (o host da vez).

##############################
### Distro e imagem do host ###
##############################

# Linha da tabela `distros` (vars/main.yml) da distribuição do host.
infra_vms_distro: "{{ distros[distro_base] }}"

# Imagem base fixada da distribuição do host e seu caminho no cache.
infra_vms_imagem: "{{ imagens_base[distro_base] }}"
infra_vms_imagem_caminho: "{{ pasta_cache_imagens }}/{{ infra_vms_imagem.arquivo }}"

#######################################
### Nomes e caminhos de cada VM     ###
#######################################

# Nome do domínio no libvirt. Ex.: "k8sbox-manager1".
infra_vms_dominio: "{{ libvirt_prefixo }}-{{ inventory_hostname }}"

# Pasta da VM no Target: disco, seed e arquivos do cloud-init.
infra_vms_dir: "{{ pasta_vms }}/{{ inventory_hostname }}"
infra_vms_disco: "{{ infra_vms_dir }}/disco.qcow2"
infra_vms_seed: "{{ infra_vms_dir }}/seed.iso"
infra_vms_cloudinit_dir: "{{ infra_vms_dir }}/cloud-init"

# Tamanho do overlay: disk_size do host ou o padrão global.
infra_vms_disk_size: "{{ disk_size | default(disk_size_default) }}"

# MAC derivado do IP: 52:54:00:<2º octeto>:<3º octeto>:<4º octeto> em hexadecimal.
# Ex.: 172.24.0.31 -> 52:54:00:18:00:1f. O cloud-init casa a placa por ele.
infra_vms_ip_octetos: "{{ ansible_host.split('.') | map('int') | list }}"
infra_vms_mac: >-
  52:54:00:{{ '%02x' | format(infra_vms_ip_octetos[1]) }}:{{ '%02x' | format(infra_vms_ip_octetos[2]) }}:{{ '%02x' | format(infra_vms_ip_octetos[3]) }}

# Pacotes do SO desta VM: grupo `base` (toda VM) mais um grupo da tabela para
# cada grupo do inventário a que o host pertence (cluster, loadbalancers, nfs,
# clientes). O grupo `todos` do inventário não inclui o kubox, por isso `base`.
infra_vms_pacotes: >-
  {{ (['base'] + group_names)
     | select('in', infra_vms_distro.pacotes)
     | map('extract', infra_vms_distro.pacotes)
     | flatten | unique | list }}

###############################
### Rede de management (NAT) ###
###############################

# Gateway da rede NAT (primeiro IP de rede_cidr_hosts), usado como rota padrão.
rede_mgmt_gateway: "{{ rede_cidr_hosts | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"

# Prefixo (/24) e máscara da rede de management.
rede_mgmt_prefixo: "{{ rede_cidr_hosts | ansible.utils.ipaddr('prefix') }}"
rede_mgmt_mascara: "{{ rede_cidr_hosts | ansible.utils.ipaddr('netmask') }}"

#######################################
### Esperas do primeiro boot        ###
#######################################

# Tempo máximo (segundos) até o SSH responder como ansible_user.
infra_vms_ssh_timeout: 300

# Tempo máximo (segundos) de `cloud-init status --wait`.
infra_vms_cloudinit_timeout: 900

# Nome do snapshot libvirt tirado logo depois do cloud-init (usado pelo clean-k8s).
infra_vms_snapshot_so: "so"

#######################################
### cloud-init (user-data)          ###
#######################################

# Conteúdo do user-data como dicionário; o template escreve `#cloud-config` +
# to_nice_yaml. A Fase B acrescenta timezone, locale, ntp, write_files e runcmd
# a partir da tabela `distros`.
infra_vms_user_data:
  hostname: "{{ inventory_hostname }}"
  fqdn: "{{ fqdn }}"
  preserve_hostname: false
  manage_etc_hosts: false
  users:
    - name: "{{ ansible_user }}"
      shell: /bin/bash
      sudo: "ALL=(ALL) NOPASSWD:ALL"
      lock_passwd: true
      ssh_authorized_keys:
        - "{{ infra_vms_chave_publica }}"
  package_update: true
  package_upgrade: false
  packages: "{{ infra_vms_pacotes }}"

# Memória mínima: o dnf do cloud-init sofre OOM em VMs de 384 MiB (medido), então
# os nós de suporte usam 512 MiB. Não use swap: o Kubernetes exige swap desligado
# e o projeto mantém a mesma regra em todas as VMs.
