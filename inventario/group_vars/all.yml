# inventario/group_vars/all.yml
---
# Caminho absoluto para a pasta de artefatos
pasta_artefatos: "{{ playbook_dir }}/../artefatos"

# Pasta onde ficam os artefatos dos certificados
pasta_temporarios: "{{ pasta_artefatos }}/tmp"

#############################################################
### Configurações para as role relacionadas ao kubernetes ###
#############################################################

# Conteiner Runtime
container_runtime: "crio" #Opções disponíveis: containerd e crio

container_runtime_sockets:
  containerd: unix:///var/run/containerd/containerd.sock
  crio: unix:///var/run/crio/crio.sock

# Plugin de CNI
plugin_cni: "cilium"  #Opções disponíveis: canal (flannel+calico) e cilium

# Redes do projeto
rede_cidr_hosts: "172.24.0.0/24"
rede_cidr_pods: "172.25.0.0/17"
rede_cidr_services: "172.25.128.0/17"

# Primeiros IPs das redes
primeiro_ip_hosts: "{{ rede_cidr_hosts | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"
primeiro_ip_pods: "{{ rede_cidr_pods | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"
primeiro_ip_services: "{{ rede_cidr_services | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"
coredns_ip: "{{ rede_cidr_services | ansible.utils.ipaddr('10') | ansible.utils.ipaddr('address') }}"

# Range de IPs para o Kube-vip fazer LoadBalancing
kubevip_ips_manuais: "172.24.0.101-172.24.0.150"
kubevip_ips_loadbalacing: "172.24.0.201-172.24.0.250"

# Portas usadas no projeto
porta_etcd_https: 2379
porta_etcd_peers: 2380
porta_etcd_metricas: 2381
porta_kube_apiserver: 6443
porta_kube_controller_manager: 10257
porta_kube_scheduler: 10259

##############################################
### Configurações para a role 00-artefatos ###
##############################################

# Para verificar as versões e os checksums:
# - Etcd: https://github.com/etcd-io/etcd/releases/
# - Kubernetes: https://kubernetes.io/releases/download/#binaries

# Versões dos componentes
versao_etcd: "3.7.1"          # https://endoflife.date/etcd e tag da versão corrente em https://github.com/kubernetes/kubernetes/blob/master/build/dependencies.yaml
versao_kubernetes: "v1.37.0"  # https://endoflife.date/kubernetes e https://dl.k8s.io/release/stable.txt
versao_crictl: "v1.37.0"      # https://github.com/kubernetes-sigs/cri-tools/releases
versao_pause: "3.10.2"        # https://github.com/kubernetes/kubernetes/blob/master/build/pause/CHANGELOG.md
versao_cni: "v1.9.1"          # https://github.com/containernetworking/plugins/releases e https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/
versao_gateway_api: "v1.6.2"  # https://github.com/kubernetes-sigs/gateway-api/releases/
versao_helm: "v3.22.0"        # https://github.com/helm/helm/releases
versao_k9s: "v0.51.0"         # https://github.com/derailed/k9s/releases
versao_popeye: "v0.22.1"      # https://github.com/derailed/popeye/releases
versao_kubevip: "v1.2.4"      # https://github.com/kube-vip/kube-vip/releases
versao_kubevip_cloud_provider: "v0.0.12" # https://github.com/kube-vip/kube-vip-cloud-provider/releases

# Imagens necessárias em todos os nós do cluster (managers e workers)
# Checar tags das imagens disponíveis em https://explore.ggcr.dev/?repo=registry.k8s.io
node_images:
  pause: "registry.k8s.io/pause:{{ versao_pause }}"
  proxy: "registry.k8s.io/kube-proxy:{{ versao_kubernetes }}"

# Imagens dos componentes do control plane (apenas managers)
control_plane_images:
  etcd:               "registry.k8s.io/etcd:{{ versao_etcd }}"
  apiserver:          "registry.k8s.io/kube-apiserver:{{ versao_kubernetes }}"
  controller_manager: "registry.k8s.io/kube-controller-manager:{{ versao_kubernetes }}"
  scheduler:          "registry.k8s.io/kube-scheduler:{{ versao_kubernetes }}"

# Versões dos plugins de rede (CNI)
versao_canal: "v3.32.0"       # https://github.com/projectcalico/calico/releases (Flannel + Calico)
versao_flannel: "v0.28.9"     # https://github.com/flannel-io/flannel/releases
versao_cilium: "v1.20.2"      # https://github.com/cilium/cilium/releases

# IP do Hubble UI via LoadBalancer (padrão dos outros dashboards do projeto)
cilium_hubble_ui_ip: "172.24.0.104"  # 101=Headlamp, 102=Traefik, 103=Grafana, 104=Hubble

# Kubernetes: https://kubernetes.io/releases/download/
download_artefatos:
  tailspin-bin:
    url: "https://github.com/bensadeh/tailspin/releases/latest/download/tailspin-x86_64-unknown-linux-musl.tar.gz"
    arquivo: "tailspin.tar.gz"

  yq-bin:
    url: "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
    arquivo: "yq"

  kubelet-bin:
    url: "https://dl.k8s.io/release/{{ versao_kubernetes }}/bin/linux/amd64/kubelet"
    arquivo: "kubelet"
    checksum: "sha256:https://dl.k8s.io/release/{{ versao_kubernetes }}/bin/linux/amd64/kubelet.sha256"

  kubectl-bin:
    url: "https://dl.k8s.io/release/{{ versao_kubernetes }}/bin/linux/amd64/kubectl"
    arquivo: "kubectl"
    checksum: "sha256:https://dl.k8s.io/release/{{ versao_kubernetes }}/bin/linux/amd64/kubectl.sha256"

  cni-plugins-bin:
    url: "https://github.com/containernetworking/plugins/releases/download/{{ versao_cni }}/cni-plugins-linux-amd64-{{ versao_cni }}.tgz"
    arquivo: "cni-plugins.tgz"
    checksum: "sha256:https://github.com/containernetworking/plugins/releases/download/{{ versao_cni }}/cni-plugins-linux-amd64-{{ versao_cni }}.tgz.sha256"

  crictl-bin:
    url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ versao_crictl }}/crictl-{{ versao_crictl }}-linux-amd64.tar.gz"
    arquivo: "crictl.tar.gz"
    checksum: "sha256:https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ versao_crictl }}/crictl-{{ versao_crictl }}-linux-amd64.tar.gz.sha256"

  helm-bin:
    url: "https://get.helm.sh/helm-{{ versao_helm }}-linux-amd64.tar.gz"
    arquivo: "helm-bin.tar.gz"
    checksum: "sha256:https://get.helm.sh/helm-{{ versao_helm }}-linux-amd64.tar.gz.sha256"

  k9s-bin:
    url: "https://github.com/derailed/k9s/releases/download/{{ versao_k9s }}/k9s_Linux_amd64.tar.gz"
    arquivo: "k9s-bin.tar.gz"
    checksum: "sha256:https://github.com/derailed/k9s/releases/download/{{ versao_k9s }}/checksums.sha256"

  popeye-bin:
    url: "https://github.com/derailed/popeye/releases/download/{{ versao_popeye }}/popeye_linux_amd64.tar.gz"
    arquivo: "popeye-bin.tar.gz"
    checksum: "sha256:https://github.com/derailed/popeye/releases/download/{{ versao_popeye }}/checksums.sha256"

########################################
### Configurações para a role 02-pki ###
########################################

# Pasta onde ficam os artefatos dos certificados
pki_pasta_base: "{{ pasta_artefatos }}/pki"

# Pastas para os CAs e certificados:
pki_pastas:
  ca: "{{ pki_pasta_base }}/CAs"
  etcd: "{{ pki_pasta_base }}/etcd"
  k8s: "{{ pki_pasta_base }}/k8s"

# Configuração que decide se os certificados serão regerados
pki_regerar_certs: false

# Configurações para o Root CA
pki_root_ca:
  path_chave: "{{ pki_pastas.ca }}/root-ca-priv.pem"
  path_cert: "{{ pki_pastas.ca }}/root-ca-cert.pem"

# Configurações para os CAs intermediários
pki_cas:
  etcd:
    path_chave: "{{ pki_pastas.ca }}/ca-etcd-priv.pem"
    path_cert: "{{ pki_pastas.ca }}/ca-etcd-cert.pem"
    ca_pai: "{{ pki_root_ca }}"

  kubernetes:
    path_chave: "{{ pki_pastas.ca }}/ca-k8s-priv.pem"
    path_cert: "{{ pki_pastas.ca }}/ca-k8s-cert.pem"
    ca_pai: "{{ pki_root_ca }}"

  front_proxy:
    path_chave: "{{ pki_pastas.ca }}/ca-front-proxy-priv.pem"
    path_cert: "{{ pki_pastas.ca }}/ca-front-proxy-cert.pem"
    ca_pai: "{{ pki_root_ca }}"

# Configurações para os certificados
pki_certs:
  etcd_server:
    path_chave: "{{ pki_pastas.etcd }}/%s-etcd-node-server-priv.pem"
    path_cert: "{{ pki_pastas.etcd }}/%s-etcd-node-server-cert.pem"
    ca_pai: "{{ pki_cas['etcd'] }}"

  etcd_peer:
    path_chave: "{{ pki_pastas.etcd }}/%s-etcd-node-peer-priv.pem"
    path_cert: "{{ pki_pastas.etcd }}/%s-etcd-node-peer-cert.pem"
    ca_pai: "{{ pki_cas['etcd'] }}"

  etcd_cli:
    path_chave: "{{ pki_pastas.etcd }}/etcd-cli-priv.pem"
    path_cert: "{{ pki_pastas.etcd }}/etcd-cli-cert.pem"
    ca_pai: "{{ pki_cas['etcd'] }}"

  kube_apiserver:
    path_chave: "{{ pki_pastas.k8s }}/%s-kube-apiserver-priv.pem"
    path_cert: "{{ pki_pastas.k8s }}/%s-kube-apiserver-cert.pem"
    ca_pai: "{{ pki_cas['kubernetes'] }}"

  kube_apiserver_etcd_cli:
    path_chave: "{{ pki_pastas.etcd }}/kube-apiserver-etcd-cli-priv.pem"
    path_cert: "{{ pki_pastas.etcd }}/kube-apiserver-etcd-cli-cert.pem"
    ca_pai: "{{ pki_cas['etcd'] }}"

  kube_apiserver_kubelet_cli:
    path_chave: "{{ pki_pastas.k8s }}/kube-apiserver-kubelet-cli-priv.pem"
    path_cert: "{{ pki_pastas.k8s }}/kube-apiserver-kubelet-cli-cert.pem"
    ca_pai: "{{ pki_cas['kubernetes'] }}"

  kube_front_proxy_cli:
    path_chave: "{{ pki_pastas.k8s }}/kube-front-proxy-cli-priv.pem"
    path_cert: "{{ pki_pastas.k8s }}/kube-front-proxy-cli-cert.pem"
    ca_pai: "{{ pki_cas['front_proxy'] }}"

  kube_controller_manager:
    path_chave: "{{ pki_pastas.k8s }}/%s-kube-controller-manager-priv.pem"
    path_cert: "{{ pki_pastas.k8s }}/%s-kube-controller-manager-cert.pem"
    ca_pai: "{{ pki_cas['kubernetes'] }}"

  kube_scheduler:
    path_chave: "{{ pki_pastas.k8s }}/%s-kube-scheduler-priv.pem"
    path_cert: "{{ pki_pastas.k8s }}/%s-kube-scheduler-cert.pem"
    ca_pai: "{{ pki_cas['kubernetes'] }}"

  kubelet:
    path_chave: "{{ pki_pastas.k8s }}/%s-kubelet-priv.pem"
    path_cert: "{{ pki_pastas.k8s }}/%s-kubelet-cert.pem"
    ca_pai: "{{ pki_cas['kubernetes'] }}"

  service_account:
    path_chave: "{{ pki_pastas.k8s }}/service-account-priv.pem"
    path_cert: "{{ pki_pastas.k8s }}/service-account-cert.pem"
    ca_pai: "{{ pki_cas['kubernetes'] }}"

  admin_account:
    path_chave: "{{ pki_pastas.k8s }}/admin-account-priv.pem"
    path_cert: "{{ pki_pastas.k8s }}/admin-account-cert.pem"
    ca_pai: "{{ pki_cas['kubernetes'] }}"

############################################
### Configurações para a role 03-haproxy ###
############################################

# Timeouts
haproxy_timeout_connect: 5s
haproxy_timeout_client: 1h
haproxy_timeout_server: 1h
haproxy_timeout_tunnel: 12h
haproxy_timeout_check: 5s
haproxy_retries: 3

# Credenciais
haproxy_stats_usr: "admin"
haproxy_stats_senha: "senha_muito_segura!"

# Portas
porta_haproxy_stats: 9000

# Configuração de hosts para os endpoints principais
vip_api_fqdn: "api.k8sbox.local"
vip_etcd_fqdn: "etcd.k8sbox.local"

# Configuração do Keepalived
keepalived_vip_ip: "172.24.0.10"
keepalived_vip_cidr: "172.24.0.10/24"
keepalived_senha: "SenhaSuperSecreta123"

###################################################
### Configurações para a role infra-vms (libvirt) ###
###################################################

# Imagem base (qcow2) cacheada no host e reutilizada entre recriações de VM.
#
# FASE A (atual): base cloud do AlmaLinux 10 GenericCloud (x86_64), mantendo o
# SO antigo enquanto se troca apenas o provisionador (Vagrant -> libvirt/Ansible).
# FASE B: trocar para o Debian 13 "Trixie" generic amd64 publicado em
# https://cloud.debian.org/images/cloud/trixie/latest/
imagem_base_url: "https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2"

# Nome do arquivo qcow2 como fica no pool/cache do libvirt.
imagem_base_arquivo: "AlmaLinux-10-GenericCloud-latest.x86_64.qcow2"

# URL do checksum publicado para verificar a integridade da imagem base.
# FASE A: o AlmaLinux publica checksums em SHA256.
# FASE B: passa a ser o SHA512SUMS do Debian (mesma pasta "latest" acima).
imagem_base_checksum_url: "https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM"

# Algoritmo do checksum da imagem base.
# FASE A: sha256 (AlmaLinux). FASE B: vira sha512 (Debian SHA512SUMS).
imagem_base_checksum_algo: "sha256"

# Pool do libvirt onde ficam a imagem base e os overlays das VMs.
# Coerente com o default LIBVIRT_POOL_PATH do Makefile.
libvirt_pool_path: "/var/lib/libvirt/images"

# Caminho de cache da imagem base (mesmo diretório do pool nesta fase).
libvirt_cache_path: "{{ libvirt_pool_path }}"

# URI de conexão com o libvirt (sempre do sistema, sem sudo).
# Coerente com o default LIBVIRT_URI do Makefile.
libvirt_uri: "qemu:///system"

# Nome da rede libvirt NAT de management criada/destruída pelo provisionador.
rede_mgmt_nome: "k8sbox_mgmt"

# Tamanho de disco padrão do overlay quando o host não define disk_size.
# Coerente com o default DISK_SIZE_DEFAULT do Makefile.
disk_size_default: "20G"

# Nome da interface de rede dentro da VM. Depende da box/imagem usada;
# é referenciado pelo cloud-init (network-config) e pelo keepalived.
interface_rede: "enp1s0"

# Habilita a virtualização aninhada (nested) no XML do domínio.
cpu_nested: true
